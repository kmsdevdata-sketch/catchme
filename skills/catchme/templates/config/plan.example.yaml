# catchme load plan → .prod-parity/plan.yaml
# base_url uses the compose service name; port = app container port.
base_url: http://app:8080

auth:
  mode: login                 # login | token | bypass | none
  login_path: /api/auth/login
  body: '{"email": "user{n}@catchme.test", "password": "catchme-test"}'
  token_path: accessToken     # dot path in the login JSON response
  users: 50

# Targets fall back to profile.yaml → targets
# targets: {p95_ms: 500, error_rate: 0.01}

runs:
  - name: orders-list
    method: GET
    path: /api/orders?page=0&size=20
    vus: 30
    duration: 30s
    quick: true               # included in hook quick checks

  - name: order-detail
    method: GET
    path: /api/orders/{own:orders_by_user}
    vus: 30
    duration: 20s
    quick: true

  - name: ramp-orders
    method: GET
    path: /api/orders?page=0&size=20
    stages:
      - {duration: 20s, target: 20}
      - {duration: 20s, target: 80}
      - {duration: 20s, target: 160}

  - name: order-race
    script: race.js
    method: POST
    path: /api/orders
    body: '{"productId": 1, "quantity": 1}'
    vus: 100
    invariants: [stock_consistency]

  - name: order-race-low-stock      # oversell check: product 2 seeded with stock 10
    script: race.js
    method: POST
    path: /api/orders
    body: '{"productId": 2, "quantity": 1}'
    vus: 100
    expected_status: [409]          # "out of stock" is the correct answer for 90 of them
    invariants: [no_oversell]

breakpoint:
  run: orders-list            # which run's request to use
  start_vus: 10
  max_vus: 640
  stage_duration: 20s
