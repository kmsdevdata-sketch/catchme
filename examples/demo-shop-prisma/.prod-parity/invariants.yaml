invariants:
  - name: stock_consistency
    description: final stock = initial stock - quantity sold during the run (product 1)
    before: |
      SELECT p.stock AS stock_before,
             (SELECT COALESCE(MAX(id), 0) FROM "OrderItem") AS max_item_id
      FROM "Product" p WHERE p.id = 1
    check: |
      SELECT p.stock = ({{snap}}->>'stock_before')::int - COALESCE(SUM(oi.quantity), 0) AS ok,
             ({{snap}}->>'stock_before')::int AS stock_before,
             p.stock AS stock_after,
             COALESCE(SUM(oi.quantity), 0)::int AS sold_during_run,
             COUNT(oi.id)::int AS orders_created
      FROM "Product" p
      LEFT JOIN "OrderItem" oi ON oi."productId" = p.id AND oi.id > ({{snap}}->>'max_item_id')::int
      WHERE p.id = 1
      GROUP BY p.stock

  - name: no_oversell
    description: units sold never exceed the starting stock (product 2, stock 10)
    before: |
      SELECT p.stock AS stock_before,
             (SELECT COALESCE(MAX(id), 0) FROM "OrderItem") AS max_item_id
      FROM "Product" p WHERE p.id = 2
    check: |
      SELECT COALESCE(SUM(oi.quantity), 0) <= ({{snap}}->>'stock_before')::int
             AND p.stock = ({{snap}}->>'stock_before')::int - COALESCE(SUM(oi.quantity), 0) AS ok,
             ({{snap}}->>'stock_before')::int AS stock_before,
             p.stock AS stock_after,
             COALESCE(SUM(oi.quantity), 0)::int AS sold_during_run
      FROM "Product" p
      LEFT JOIN "OrderItem" oi ON oi."productId" = p.id AND oi.id > ({{snap}}->>'max_item_id')::int
      WHERE p.id = 2
      GROUP BY p.stock
