base_url: http://app:8080
auth:
  mode: login
  login_path: /auth/login
  body: '{"email": "user{n}@catchme.test", "password": "catchme-test"}'
  token_path: token
  users: 50
  header: Authorization
  scheme: Bearer

runs:
  - name: orders-list
    method: GET
    path: /orders?limit=20
    vus: 30
    duration: 30s
    quick: true

  - name: product-detail
    method: GET
    path: /products/{rand:1-2000}
    vus: 30
    duration: 20s
    quick: true

  - name: ramp-orders
    method: GET
    path: /orders?limit=20
    stages:
      - {duration: 20s, target: 20}
      - {duration: 20s, target: 80}
      - {duration: 20s, target: 160}

  - name: order-race
    script: race.js
    method: POST
    path: /orders
    body: '{"productId": 1, "quantity": 1}'
    vus: 100
    invariants: [stock_consistency]

  - name: order-race-low-stock
    script: race.js
    method: POST
    path: /orders
    body: '{"productId": 2, "quantity": 1}'
    vus: 100
    expected_status: [409]
    invariants: [no_oversell]
